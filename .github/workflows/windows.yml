name: Windows Installer

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MyApp/MyApp.csproj

      - name: Publish
        run: dotnet publish MyApp/MyApp.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Verify publish output
        run: |
          dir publish
          if (-not (Test-Path "publish/SimplyGreatTimer.exe")) {
            Write-Error "Publish failed: publish/SimplyGreatTimer.exe not found"
            exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc installer.iss

      - name: Verify installer output (DEBUG)
        run: |
          dir Output
          if (-not (Test-Path "Output/SimplyGreatTimer-Setup.exe")) {
            Write-Error "Installer build failed: Output/SimplyGreatTimer-Setup.exe not found"
            exit 1
          }

      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          files: Output/SimplyGreatTimer-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
