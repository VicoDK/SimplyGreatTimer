name: Mac Installer

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet nuget locals all --clear

      - run: dotnet restore MyApp/MyApp.csproj

      - run: |
          dotnet publish MyApp/MyApp.csproj \
            -c Release \
            -f net10.0 \
            -r osx-arm64 \
            --self-contained true \
            -p:UseAppHost=true \
            -p:PublishSingleFile=false

      - run: |
          APP=$(find MyApp/bin/Release -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "No .app produced"
            exit 1
          fi

          mkdir package
          cp -R "$APP" package/SimplyGreatTimer.app

      - run: brew install create-dmg

      - run: |
          create-dmg \
            --volname "SimplyGreatTimer" \
            --window-size 700 400 \
            --icon-size 120 \
            --icon "SimplyGreatTimer.app" 180 180 \
            --app-drop-link 500 180 \
            "SimplyGreatTimer-MacOS-Install.dmg" \
            package/

      - uses: softprops/action-gh-release@v2
        with:
          files: SimplyGreatTimer-MacOS-Install.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
