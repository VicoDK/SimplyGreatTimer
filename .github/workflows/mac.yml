name: Mac Installer

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MyApp/MyApp.csproj

      - name: Publish
        run: |
          dotnet publish MyApp/MyApp.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -o publish

      - name: Create App Bundle
        run: |
          mkdir -p app/SimplyGreatTimer.app/Contents/MacOS
          mkdir -p app/SimplyGreatTimer.app/Contents/Resources

          cp -R publish/* app/SimplyGreatTimer.app/Contents/MacOS/

          if [ -f app/SimplyGreatTimer.app/Contents/MacOS/MyApp ]; then
            mv \
              app/SimplyGreatTimer.app/Contents/MacOS/MyApp \
              app/SimplyGreatTimer.app/Contents/MacOS/SimplyGreatTimer
          fi

      - name: Create Info.plist
        run: |
          cat > app/SimplyGreatTimer.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

            <key>CFBundleName</key>
            <string>SimplyGreatTimer</string>

            <key>CFBundleDisplayName</key>
            <string>SimplyGreatTimer</string>

            <key>CFBundleExecutable</key>
            <string>SimplyGreatTimer</string>

            <key>CFBundleIdentifier</key>
            <string>com.vicodk.simplygreattimer</string>

            <key>CFBundleVersion</key>
            <string>1.0</string>

            <key>CFBundlePackageType</key>
            <string>APPL</string>

          </dict>
          </plist>
          EOF

      - name: Make Executable
        run: chmod -R +x app/SimplyGreatTimer.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: |
          create-dmg \
            --volname "SimplyGreatTimer" \
            --window-size 700 400 \
            --icon-size 120 \
            --icon "SimplyGreatTimer.app" 180 180 \
            --app-drop-link 500 180 \
            SimplyGreatTimer-MacOS-Install.dmg \
            app/

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: SimplyGreatTimer-MacOS-Install.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}